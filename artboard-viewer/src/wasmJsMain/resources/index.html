<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Artboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23111'/><rect x='3' y='3' width='4' height='4' fill='%23fff'/><rect x='9' y='3' width='4' height='4' fill='%23888'/><rect x='3' y='9' width='4' height='4' fill='%23888'/><rect x='9' y='9' width='4' height='4' fill='%23fff'/></svg>">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #artboard-loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #52525b;
            font-size: 14px;
            letter-spacing: 0.02em;
            background-color: #f4f4f5;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        canvas {
            outline: none;
        }
    </style>
</head>
<body>
<div id="artboard-loading">Loading Artboard…</div>
<script type="module" src="artboard-viewer.js"></script>
<script>
    // Compose creates its canvas asynchronously; hide the placeholder once it exists
    // so the board never flashes an empty page.
    (function () {
        var loading = document.getElementById('artboard-loading');
        if (!loading) return;
        var observer = new MutationObserver(function () {
            if (document.querySelector('canvas')) {
                loading.remove();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });
    })();
</script>
</body>
</html>
